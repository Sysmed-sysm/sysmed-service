<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sysmed Service — Admin Portal</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <!-- PWA & Mobile App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sysmed Admin">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f6fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .app-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    #loadingScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #667085;
      font-size: 16px;
      font-weight: 600;
      background: #f4f6fb;
    }
  </style>
</head>
<body>

  <div id="appContainer" style="width:100%; height:100%;">
    <div id="loadingScreen">Loading Sysmed Admin Portal…</div>
  </div>

  <script>
    // NOTE: Append ?view=mobile to load your Admin Mobile app version!
    const TARGET_URL = "https://script.google.com/macros/s/AKfycbzwd8nenOgJOzocV734wNnGY2VmLHWdNvZ6oiW3ZE7Kk7XHMPNzJttJOOs7Rjb50baG/exec?view=mobile";
    const container = document.getElementById('appContainer');
    
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    if (isIOS) {
      // iPhone Safari: Direct redirect for robust cookie/session handling
      window.location.replace(TARGET_URL);
    } else {
      // Android, Windows, Mac (Desktop & Chrome): Load inside full-screen iframe wrapper
      container.innerHTML = `
        <iframe
          id="portalFrame"
          class="app-frame"
          src="${TARGET_URL}"
          allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
          allowfullscreen>
        </iframe>`;
    }

    // Register Service Worker for PWA installation
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
